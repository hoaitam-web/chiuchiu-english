<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lessons • ChiuChiu English</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#191d3a;color:#18203a}
.page{width:min(1200px,calc(100% - 40px));min-height:100vh;margin:20px auto;background:#fff;padding-bottom:60px}
header{height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #edf0f5}
.logo{font-size:20px;font-weight:800;display:flex;gap:12px;align-items:center}
.logo i{width:22px;height:22px;background:#8db3f5;border-radius:50%}
.back{color:#2773c7;text-decoration:none;font-weight:700}
main{padding:55px 7%}
.eyebrow{font-size:13px;color:#2773c7;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
h1{font-size:54px;letter-spacing:-2px;margin:10px 0 12px}
.intro{color:#697286;line-height:1.7;max-width:680px;margin-bottom:38px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{
  height:260px;
  border:1px solid #e4e9f2;
  border-radius:24px;
  background:#f9fbff;
  box-shadow:0 12px 30px #18203a0c;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:.2s;
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 35px #18203a18}
.card h2{font-size:38px;letter-spacing:-1.5px;margin-bottom:30px}
.card a{
  background:#f65369;
  color:#fff;
  text-decoration:none;
  font-weight:800;
  padding:12px 23px;
  border-radius:25px;
  font-size:14px;
}
.card a:hover{background:#e9445b}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){
  .page{width:calc(100% - 20px);margin:10px auto}
  header{height:70px;padding:0 5%}
  main{padding:45px 7%}
  h1{font-size:43px}
  .grid{grid-template-columns:1fr}
  .card{height:220px}
  .card h2{font-size:34px}
}
</style>
</head>
<body>
<div class="page">

<header>
  <div class="logo"><i></i> ChiuChiu English.</div>
  <a class="back" href="index.html">← Home</a>
</header>

<main>
  <div class="eyebrow">Your learning path</div>
  <h1>Lessons</h1>
  <p class="intro">
    Choose a lesson and practise English through real workplace conversations,
    with a focus on Australian meetings.
  </p>

  <div class="grid">
    <div class="card">
      <h2>Lesson 01</h2>
      <a href="lesson1.html">OPEN LESSON →</a>
    </div>

    <div class="card">
      <h2>Lesson 02</h2>
      <a href="lesson2.html">OPEN LESSON →</a>
    </div>

    <div class="card">
      <h2>Lesson 03</h2>
      <a href="lesson3.html">OPEN LESSON →</a>
    </div>
  </div>
</main>

</div>
</body>
</html>
